[package]
name = "sdmqtt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A distributed MQTT broker"

[dependencies]
sdmqtt-server = { path = "../server", version = "0.1.0" }
# Section 8.1's node identity, minted or read back at startup. Already
# in the binary through `rules`, which orders singleton ownership by
# it; named here because this crate is the one that decides when it is
# minted and writes it down.
cluster = { path = "../cluster", version = "0.1.0" }
sdmqtt-admin = { path = "../admin", version = "0.1.0" }
broker-core = { path = "../broker-core", version = "0.1.0" }
# The rules and the outbound connector. This is where the HTTP client
# and the TLS under it enter the binary.
rules = { path = "../rules", version = "0.1.0" }
mqtt-codec = { path = "../mqtt-codec", version = "0.1.0" }
# With its default features, which is the redb backend: this is the
# crate that actually opens a file. `broker-core` and `sdmqtt-server`
# turn them off, and the binary is where the choice of engine is made.
storage = { path = "../storage", version = "0.1.0" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "derive", "error-context"] }
serde = { version = "1", features = ["derive"] }
# A dead letter's payload, which the broker takes as `Bytes` and never
# copies.
bytes.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
# For the store tests: a directory that is created, opened and thrown
# away, so that a test never writes into the tree it is run from.
tempfile.workspace = true
# `tests/restart.rs` speaks MQTT to the binary over a real socket, and
# the codec reads and writes through `BytesMut`.
bytes.workspace = true
# `tests/cluster.rs` reads the admin API's node listing, which is a
# document with an envelope around it: a substring search would pass
# against a page that named the right node in the wrong field. Already
# in the binary through the admin crate, so this costs no new crate.
serde_json = { version = "1", default-features = false, features = ["std"] }
# `tests/interface.rs` asks the binary for the interface as brotli and
# has to prove the bytes really are brotli. A decoder says so; a
# content-encoding header does not. Dev only, so nothing of it ships.
brotli = { version = "8", default-features = false, features = ["std"] }
rcgen = "0.14"

[lints]
workspace = true
