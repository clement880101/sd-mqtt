[package]
name = "sdmqtt-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The listener and connection handling for sd-mqtt"

[features]
# Exposes `shared::gated`, a store whose flush a test can hold open.
# Off by default and turned on by nothing this crate ships: it exists
# so that `sdmqtt-admin`'s tests can make the same assertion about its
# publish endpoint that `connection`'s tests make about a client's,
# without a second gated store carrying a second set of assumptions
# about what a device does.
testing = []

[dependencies]
broker-core = { path = "../broker-core", version = "0.7.0" }
# Section 8.2's replicated registers. The shell is where the broker's
# journal is written down, and a filter gaining or losing its last local
# subscriber is a replicated write that has to go in the same batch as
# the subscription that caused it — so the thing that stamps it is held
# here. The direction is the layering, as it is for `rules`: `cluster`
# knows nothing about a connection.
cluster = { path = "../cluster", version = "0.7.0" }
mqtt-codec = { path = "../mqtt-codec", version = "0.7.0" }
# Default features off, and not for `broker-core`'s reason. This crate is
# allowed a disk; it simply has no use for one. It needs the record
# vocabulary and the batching writer, both of which are backend
# independent, and which store the writer is given is `sdmqtt`'s choice
# to make and nothing this crate can see.
storage = { path = "../storage", version = "0.7.0", default-features = false }
bytes.workspace = true
thiserror.workspace = true
foldhash = "0.2"
parking_lot = "0.12"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Its default feature set is empty, so there is nothing to turn off:
# the protobuf exposition formats are the only features it has and
# nothing here wants them. Three crates in total, measured by diffing
# the lock file: itself, its encode derive, and `dtoa`.
prometheus-client = "0.25"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = "0.14"
# The redb backend, for `tests/throughput.rs` alone. What a store costs
# the broker is a question about a real device, and the in-memory
# backend this crate's other tests use answers it with a number from a
# machine with no disk in it. A dev-dependency rather than a feature:
# nothing this crate ships gains redb, and `cargo tree -p sdmqtt-server
# -e normal` is still free of it.
storage = { path = "../storage", version = "0.7.0", features = ["redb"] }
# For the throughput harness's temporary store directory, thrown away
# with the measurement.
tempfile.workspace = true
# test-util is what `#[tokio::test(start_paused = true)]` needs. Without
# it the ticker tests wait on real seconds instead of asserting a
# schedule, which is slow and flaky and proves less.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "test-util",
] }

[lints]
workspace = true
