[package]
name = "directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Users, access control rules and API keys for sd-mqtt: who may connect and what they may do"

[dependencies]
mqtt-codec = { path = "../mqtt-codec", version = "0.7.0" }
storage = { path = "../storage", version = "0.7.0", default-features = false }
cluster = { path = "../cluster", version = "0.7.0" }
broker-core = { path = "../broker-core", version = "0.7.0" }
sdmqtt-server = { path = "../server", version = "0.7.0" }
# argon2id for passwords at rest, PHC strings. The one new direct
# dependency of this milestone's authentication work.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
# SCRAM's primitives — PBKDF2, HMAC-SHA-256, SHA-256 — and the salts,
# from the provider the cluster crate already links.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
