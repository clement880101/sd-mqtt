[package]
name = "storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable storage for sd-mqtt sessions, queues, bodies and retained messages"

[features]
# The redb backend, on by default so that a plain `cargo build` produces a
# broker that can store something. `broker-core` turns it off: section 7.3
# makes that crate pure, no-I/O and lock-free, and a database in its
# dependency tree would be a lie about what it is as well as a cost to
# every test that builds it. The records, the trait, the restore shape and
# the in-memory backend are unconditional, because those are the whole of
# what a pure crate needs.
default = ["redb"]
redb = ["dep:redb"]

[dependencies]
redb = { version = "4.3", optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror.workspace = true
bytes = { workspace = true, features = ["serde"] }
# Only `oneshot`, and only for the writer's waiter. The thing waiting is
# an async connection task in `sdmqtt-server`, and section 7.3 has it
# waiting for a durable commit before it acknowledges; a synchronous
# channel would park a runtime worker for the length of a disk flush,
# which is the cost this whole module exists to avoid. tokio is already a
# dependency of two crates in this workspace, so this adds nothing to the
# lock file or to the licence gate.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# `rt` and `macros` for `#[tokio::test]`, because the waiter is awaited
# rather than blocked on, and a test that blocks on it would not be
# exercising the path the shell takes. `time` is what bounds the waits
# that cannot be made deterministic, so a broken writer fails rather than
# hangs.
# `rt-multi-thread` is only for `tests/throughput.rs`: a hundred
# waiters woken by one flush on a single-threaded runtime would
# measure the runtime's wakeups rather than the device's `fsync`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
