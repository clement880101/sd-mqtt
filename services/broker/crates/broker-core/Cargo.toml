[package]
name = "broker-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Subscription matching and retained message storage for sd-mqtt"

[dependencies]
mqtt-codec = { path = "../mqtt-codec", version = "0.1.0" }
# The `Record` vocabulary, and nothing that touches a disk. Section 7.3
# makes this crate pure: it says what happened and the shell writes it.
#
# `default-features = false` is the whole point and is load bearing. With
# the backend on, a database would sit in the dependency tree of the one
# crate that performs no I/O, and every test that builds this crate would
# pay to compile it. What keeps it out is checked by:
#
#     cargo tree -p broker-core -e normal | grep -c redb
#
# which must print 0. Written here rather than as a test because the fact
# is about the dependency graph, which nothing inside the crate can see:
# a `#[cfg]` cannot ask whether another package's feature is off, and by
# the time this crate compiles the answer has already been decided.
storage = { path = "../storage", version = "0.1.0", default-features = false }
bytes.workspace = true
thiserror.workspace = true
foldhash = "0.2"
parking_lot = "0.12"
uuid = { version = "1", default-features = false, features = ["v7", "std"] }

[dev-dependencies]
proptest.workspace = true

[dev-dependencies.criterion]
version = "0.8"
default-features = false
features = ["cargo_bench_support"]

[[bench]]
name = "matching"
harness = false

[lints]
workspace = true
