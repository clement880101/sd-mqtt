name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/broker
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@nextest
      # This also runs `sdmqtt`'s restart test, milestone two's exit
      # criterion, which starts the real binary on a real socket, kills
      # it with SIGKILL and starts it again on the same store. It needs
      # no job of its own: the binary it drives is named with
      # `CARGO_BIN_EXE_sdmqtt`, so cargo builds it as a dependency of
      # the test, and the store lives in a temporary directory the test
      # makes and throws away.
      - name: Test
        run: cargo nextest run --all-features
      - name: Doc tests
        run: cargo test --doc --all-features
      # Everything above ran in a tree with no built interface, which
      # is the path every Rust-only contributor takes and the one
      # nobody would notice breaking. `tests/interface.rs` skips there
      # and says so, so the interface is built here and it is run
      # again, with the two states covered by one job.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Build the interface
        working-directory: services/web
        run: npm ci && npm run build
      - name: The interface reaches a browser from the binary
        run: cargo nextest run --all-features -p sdmqtt --test interface

  # The interface. Its build is also its licence gate: an unapproved
  # licence, or one a package stopped declaring, fails `npm run build`
  # itself, and a dependency that entered or left the bundle fails the
  # diff below. Section 11.2: the notices are generated from the
  # bundle, so they cannot drift from it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: The notices may not drift from the bundle
        run: |
          if ! git diff --exit-code -- THIRD-PARTY-NOTICES.txt; then
            echo "::error::THIRD-PARTY-NOTICES.txt is not what this bundle produces."
            echo "Run 'npm run build' in services/web and commit the result."
            exit 1
          fi

  # The licence gate is a gate. It says a crate's licence is one we
  # accept; it says nothing about whether we attributed it, and for two
  # milestones nothing did. The attribution check below is the other
  # half, and it is checked against the built binary rather than
  # against the dependency graph, for the reason the script's own
  # documentation gives.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@cargo-deny
      - name: License and advisory gate
        run: cargo deny --manifest-path services/broker/Cargo.toml --config deny.toml check
      # The generator's own tests. The drift check below compares the
      # file against what the generator produces, so a generator that
      # resolves a licence expression wrongly agrees with itself and
      # the drift check is silent. This is the half that is not.
      - name: The notices generator resolves an expression correctly
        run: python3 scripts/test_rust_notices.py
      # The same release build the budgets job measures, because the
      # audit reads the crate paths rustc recorded in it.
      - name: Build the binary the notices are audited against
        working-directory: services/broker
        run: cargo build --release --all-features -p sdmqtt
      - name: The notices may not drift from what ships
        run: scripts/rust-notices.py --check

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the development image
        run: docker build -f .devcontainer/base.Dockerfile -t sd-mqtt-dev .
      - name: Every gate must pass inside one container
        run: |
          docker run --rm \
            -v "$PWD:/workspaces/repo" \
            -w /workspaces/repo/services/broker \
            -e CARGO_TARGET_DIR=/tmp/target \
            sd-mqtt-dev \
            bash -lc '
              set -e
              cargo fmt --all --check
              cargo clippy --all-targets -- -D warnings
              cargo nextest run
              cargo deny --manifest-path Cargo.toml --config ../../deny.toml check
            '

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the broker under test
        working-directory: services/broker
        run: cargo build --release -p sdmqtt
      # Eclipse Paho's interoperability suite, pinned in run.sh. A test
      # tool run here is not distributed, so its licence needs only to
      # permit use; that is a weaker rule than deny.toml, which governs
      # what ships. The suite's known failures are classified in
      # conformance/known-failures.txt and the runner fails the build on
      # any difference from that set, in either direction.
      - name: Independent conformance suite
        env:
          SDMQTT: ${{ github.workspace }}/services/broker/target/release/sdmqtt
        run: services/broker/conformance/run.sh
      - name: Upload the suite's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-output
          path: services/broker/conformance/.work/*.out
          if-no-files-found: ignore

  # Section 15 says budgets are checked in CI and that exceeding one
  # fails the build. Two milestones went by with that untrue, which
  # convention 8's walk found. Three of the five are checked here; the
  # script says which and why the other two are not. The interface
  # bundle is one of the three now that there is an interface, which
  # is why this job builds it.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      # The bundle is one of the budgets, and an unbuilt one is an
      # error rather than a budget quietly met.
      - name: Build the interface
        working-directory: services/web
        run: npm ci && npm run build
      - name: Budgets
        run: scripts/budgets.sh

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz the decoder
        working-directory: services/broker/crates/mqtt-codec/fuzz
        run: cargo fuzz run decode -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: services/broker/crates/mqtt-codec/fuzz/artifacts/
