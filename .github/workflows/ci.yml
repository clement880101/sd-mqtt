name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/broker
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@nextest
      # This also runs `sdmqtt`'s restart test, milestone two's exit
      # criterion, which starts the real binary on a real socket, kills
      # it with SIGKILL and starts it again on the same store. It needs
      # no job of its own: the binary it drives is named with
      # `CARGO_BIN_EXE_sdmqtt`, so cargo builds it as a dependency of
      # the test, and the store lives in a temporary directory the test
      # makes and throws away.
      - name: Test
        run: cargo nextest run --all-features
      - name: Doc tests
        run: cargo test --doc --all-features

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: License and advisory gate
        run: cargo deny --manifest-path services/broker/Cargo.toml --config deny.toml check

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the development image
        run: docker build -f .devcontainer/base.Dockerfile -t sd-mqtt-dev .
      - name: Every gate must pass inside one container
        run: |
          docker run --rm \
            -v "$PWD:/workspaces/repo" \
            -w /workspaces/repo/services/broker \
            -e CARGO_TARGET_DIR=/tmp/target \
            sd-mqtt-dev \
            bash -lc '
              set -e
              cargo fmt --all --check
              cargo clippy --all-targets -- -D warnings
              cargo nextest run
              cargo deny --manifest-path Cargo.toml --config ../../deny.toml check
            '

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the broker under test
        working-directory: services/broker
        run: cargo build --release -p sdmqtt
      # Eclipse Paho's interoperability suite, pinned in run.sh. A test
      # tool run here is not distributed, so its licence needs only to
      # permit use; that is a weaker rule than deny.toml, which governs
      # what ships. The suite's known failures are classified in
      # conformance/known-failures.txt and the runner fails the build on
      # any difference from that set, in either direction.
      - name: Independent conformance suite
        env:
          SDMQTT: ${{ github.workspace }}/services/broker/target/release/sdmqtt
        run: services/broker/conformance/run.sh
      - name: Upload the suite's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-output
          path: services/broker/conformance/.work/*.out
          if-no-files-found: ignore

  # Section 15 says budgets are checked in CI and that exceeding one
  # fails the build. Two milestones went by with that untrue, which
  # convention 8's walk found. Three of the five are checked here; the
  # script says which and why the other two are not, and says out loud
  # that the interface bundle cannot be measured yet rather than
  # counting it as passed.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Budgets
        run: scripts/budgets.sh

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz the decoder
        working-directory: services/broker/crates/mqtt-codec/fuzz
        run: cargo fuzz run decode -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: services/broker/crates/mqtt-codec/fuzz/artifacts/
