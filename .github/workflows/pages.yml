name: Landing page

# site/ is the project's landing page, published with GitHub Pages
# whenever it changes on main. It is checked first against the sources
# it quotes (scripts/test_site.py), so a page that names a stale version
# or an unsourced figure is never deployed.

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/test_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The page agrees with what it quotes
        run: python3 scripts/test_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
